version: '3'
services:
 db:
    image: mysql:8.4.1
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: yourdatabasename
      MYSQL_USER: youruser
      MYSQL_PASSWORD: yourpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    networks:
      mysql-phpmyadmin:
           ipv4_address: 172.22.0.2
 phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8090:80"
    environment:
      PMA_HOST: db
      MYSQL_USER: youruser
      MYSQL_PASSWORD: yourpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      mysql-phpmyadmin:
          ipv4_address: 172.22.0.3
 web:
   command: python manage.py runserver 0.0.0.0:8701
   ports:
     - "8701:8701"
   depends_on:
     - db
   environment:
     - DATABASE_NAME=yourdatabasename
     - DATABASE_USER=youruser
     - DATABASE_PASSWORD=yourpassword
     - DATABASE_HOST=172.22.0.2
     - DATABASE_PORT=3306
   build: 
     context: /path/to/project
     dockerfile: /path/to/project/dockerfile
   networks:
      mysql-phpmyadmin:
          ipv4_address: 172.22.0.4
    
networks:
  mysql-phpmyadmin:
    driver: bridge
    name: IotApp
    ipam:
       config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1
volumes:
  db_data: